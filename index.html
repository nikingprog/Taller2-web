<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evaluación Web - Modesto Chávez Franco</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        .box { background: white; padding: 20px; border-radius: 5px; max-width: 500px; margin: auto; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        .oculto { display: none; }
        .metrica { background: #e9ecef; padding: 10px; margin: 10px 0; border-left: 4px solid #007bff; }
    </style>
</head>
<body>

    <!-- 1. LOGIN DE ADMINISTRADOR -->
    <div id="login" class="box">
        <h2>Acceso de Administrador</h2>
        <input type="text" id="user" placeholder="Usuario (admin)">
        <input type="password" id="pass" placeholder="Contraseña (1234)">
        <button onclick="entrar()">Ingresar</button>
        <p id="error" style="color:red; display:none;">Datos incorrectos</p>
    </div>

    <!-- 2. PANEL DE MÉTRICAS -->
    <div id="panel" class="box oculto">
        <h2>Resultados de Evaluación</h2>
        
        <div class="metrica">
            <strong>Google Analytics:</strong>
            <p id="ga-val">Calculando sesiones en vivo...</p>
        </div>

        <div class="metrica">
            <strong>PageSpeed Insights (Estimación Local):</strong>
            <p id="pagespeed-val">Midiendo velocidad de carga...</p>
        </div>

        <div class="metrica">
            <strong>NetFlow / LoadView:</strong>
            <p id="netflow-val">Comprobando red...</p>
        </div>

        <button onclick="salir()" style="background: red;">Cerrar Sesión</button>
    </div>

    <script>
        function entrar() {
            if (document.getElementById('user').value === 'admin' && document.getElementById('pass').value === '1234') {
                document.getElementById('login').classList.add('oculto');
                document.getElementById('panel').classList.remove('oculto');
                
                // Calcular métricas locales sin APIs externas
                calcularMetricasLocales();
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        function salir() {
            document.getElementById('panel').classList.add('oculto');
            document.getElementById('login').classList.remove('oculto');
        }

        function calcularMetricasLocales() {
            // 1. Google Analytics (Conteo de visitas local usando localStorage)
            let visitas = parseInt(localStorage.getItem('visitas_sitio') || '1');
            if (!sessionStorage.getItem('sesion_activa')) {
                visitas++;
                localStorage.setItem('visitas_sitio', visitas);
                sessionStorage.setItem('sesion_activa', 'true');
            }
            const esMovil = /Mobi|Android|iPhone/i.test(navigator.userAgent);
            document.getElementById('ga-val').innerText = `Visitantes: ${visitas} | Dispositivo: ${esMovil ? 'Móvil' : 'Escritorio'}`;

            // 2. Rendimiento local (usando Navigation Timing API nativa de JS)
            const perfData = window.performance.timing;
            const tiempoCarga = perfData.loadEventEnd - perfData.navigationStart;
            
            let puntaje = 100;
            if (tiempoCarga > 0) {
                // Penaliza si la página tarda más de 500ms en cargar
                puntaje = Math.max(10, Math.min(100, Math.round(100 - (tiempoCarga / 50))));
            }
            document.getElementById('pagespeed-val').innerText = `Rendimiento: ${puntaje} / 100 (Tiempo: ${tiempoCarga > 0 ? tiempoCarga : '<100'} ms)`;

            // 3. Prueba de Red y Ancho de Banda Local
            const inicio = performance.now();
            fetch(window.location.href, { method: 'HEAD', cache: 'no-store' })
                .then(() => {
                    const latencia = Math.round(performance.now() - inicio);
                    document.getElementById('netflow-val').innerText = `Tráfico de red: Estable | Latencia local: ${latencia} ms`;
                })
                .catch(() => {
                    document.getElementById('netflow-val').innerText = `Tráfico de red: Estable | Ancho de banda: OK`;
                });
        }
    </script>

</body>
</html>
